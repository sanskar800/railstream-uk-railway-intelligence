[project]
name = "railstream"
version = "0.1.0"
description = "Real-time GB rail performance lakehouse: Network Rail TRUST feed -> Kafka -> Spark -> Iceberg -> dbt"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.12",
    "fastjsonschema>=2.21",
    "jsonschema>=4.25",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "stomp-py>=9.0.0",
    "tzdata>=2026.6",
]

[tool.uv]
# An application of several services (ingest, serving, ...), not a library to publish:
# no build backend; modules are run with `python -m` from the repo root.
package = false

[dependency-groups]
# Installed only in the Spark image (infra/spark/Dockerfile): pyspark bundles ~400 MB of jars, and
# Spark needs Java, which the laptop does not have (Spark runs in Docker).
spark = [
    "pyspark==4.1.4",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, SIM simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
