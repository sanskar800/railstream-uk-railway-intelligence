# RailStream local stack. Run through the Makefile (make up / make down / make ps).
# Profiles: core services have none (always started); `tools` = Redpanda Console;
# `stream` = the Spark streaming jobs (make stream). Live data comes from the capture VM (ADR-012).
# `airflow` = local workflow scheduler and UI (make airflow).
# All ports bind to 127.0.0.1. Credentials are local-development defaults, overridable in .env.
name: railstream

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:-lakekeeper-local}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:-lakekeeper-local}@postgres:5432/lakekeeper
  # Encrypts storage credentials held in the catalog database.
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-local-dev-only-not-secret}
  RUST_LOG: info

# Every long-running service rotates its logs: without this, Lakekeeper's log alone reached
# 6.3 GB on the cloud VM (findings F28).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # Kafka API + Schema Registry (ADR-001). Internal listener for containers, external for the laptop.
  redpanda:
    image: redpandadata/redpanda:v26.1.20
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092,vcn://0.0.0.0:29092
      # external: not "localhost" (on Windows it may resolve to ::1 first, where nothing listens).
      # vcn: the capture VM publishes here over Oracle's private network (ADR-012); on a laptop
      # both variables are unset and it stays on 127.0.0.1.
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092,vcn://${KAFKA_VCN_HOST:-127.0.0.1}:29092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - 127.0.0.1:19092:19092   # Kafka
      - 127.0.0.1:18081:18081   # Schema Registry
      - ${KAFKA_VCN_BIND:-127.0.0.1}:29092:29092   # Kafka for the capture VM (private IP only)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1280m
    restart: unless-stopped   # always-on VM: survive crashes and reboots
    logging: *default-logging

  # S3-compatible object storage for Iceberg files (replaces MinIO: architecture.md §6).
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    entrypoint: ["/bin/sh", "/init/seaweedfs-start.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-railstream}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-railstream-local-secret}
      DBT_S3_ACCESS_KEY: ${DBT_S3_ACCESS_KEY:-railstream-dbt}
      DBT_S3_SECRET_KEY: ${DBT_S3_SECRET_KEY:-railstream-dbt-local-secret}
    ports:
      - 127.0.0.1:8333:8333     # S3 API
    volumes:
      - seaweedfs-data:/data
      - ./init:/init:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1536m          # 512m was OOM-killed while compaction rewrote large files (F25)
    restart: unless-stopped
    logging: *default-logging

  # Shared Postgres: Lakekeeper's catalog database now; Airflow's metadata database later.
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:-lakekeeper-local}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-local}
    ports:
      - 127.0.0.1:5434:5432     # 5432/5433 are taken by other local databases
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # Iceberg REST catalog (ADR-003): schema migration first, then the server.
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.2
    command: ["migrate"]
    environment: *lakekeeper-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.2
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - 127.0.0.1:8181:8181     # Iceberg REST + management API
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # One-shot, idempotent: bucket, catalog bootstrap, warehouse. Reuses the SeaweedFS image (sh, wget, weed).
  # In the `init` profile so `up --wait` ignores it; `make up` runs it explicitly after the services are healthy.
  lakehouse-init:
    image: chrislusf/seaweedfs:4.52
    profiles: ["init"]
    entrypoint: ["/bin/sh", "/init/lakehouse-init.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-railstream}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-railstream-local-secret}
    volumes:
      - ./init:/init:ro
    depends_on:
      seaweedfs: {condition: service_healthy}
      lakekeeper: {condition: service_healthy}
    restart: "no"

  # Web UI for topics, messages, schemas and consumer lag (task 1.5). On demand: make tools.
  console:
    image: redpandadata/console:v3.13.1
    profiles: ["tools"]
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - 127.0.0.1:8085:8080
    depends_on:
      redpanda: {condition: service_healthy}
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # Local development: one parent supervises API, scheduler, parser and triggerer.
  # LocalExecutor needs no Redis/Celery services. Metadata is isolated from Lakekeeper.
  airflow:
    build:
      context: ../..
      dockerfile: infra/airflow/Dockerfile
    image: railstream-airflow:dev
    profiles: ["airflow"]
    command: ["python", "/railstream/infra/airflow/start.py"]
    environment:
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-local}
      AIRFLOW_UI_PASSWORD: ${AIRFLOW_UI_PASSWORD:-railstream-local}
      NR_USERNAME: ${NR_USERNAME:-}
      NR_PASSWORD: ${NR_PASSWORD:-}
      CATALOG_URI: http://lakekeeper:8181/catalog
      WAREHOUSE: railstream
      PYICEBERG_MAX_WORKERS: "1"   # parallel remote-signed S3 requests race (findings F22)
      # dbt (Day 9, ADR-017): its own environment in the image; scoped storage key; state on the volume.
      DBT_S3_ACCESS_KEY: ${DBT_S3_ACCESS_KEY:-railstream-dbt}
      DBT_S3_SECRET_KEY: ${DBT_S3_SECRET_KEY:-railstream-dbt-local-secret}
      DBT_PROJECT_DIR: /opt/railstream/transform
      DBT_PROFILES_DIR: /opt/railstream/transform
      DBT_TARGET_PATH: /opt/airflow/dbt/target
      DBT_LOG_PATH: /opt/airflow/dbt/logs
      DBT_DUCKDB_PATH: /opt/airflow/dbt/railstream.duckdb
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python /railstream/infra/airflow/start.py --database-url
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: railstream:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/ui-passwords.json
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://127.0.0.1:8080/execution/
      AIRFLOW__API__BASE_URL: http://localhost:8086
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-railstream-local-jwt-for-development-only}
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "2"
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "2"
    ports:
      - 127.0.0.1:8086:8080
    volumes:
      - airflow-home:/opt/airflow
      - ../airflow:/railstream/infra/airflow:ro
      - ../../orchestration/dags:/opt/airflow/dags:ro
      - ../../transform:/opt/railstream/transform:ro
    depends_on:
      postgres: {condition: service_healthy}
      lakekeeper: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
      spark-connect: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "/railstream/infra/airflow/health.py"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    mem_limit: 1536m
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *default-logging

  # Kafka -> Iceberg bronze (task 5.2). Spark in local mode inside one container (ADR-007).
  spark-bronze:
    build:
      context: ../..
      dockerfile: infra/spark/Dockerfile
    image: railstream-spark:dev
    profiles: ["stream"]
    command: ["python", "-m", "streaming.bronze"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      CATALOG_URI: http://lakekeeper:8181/catalog
      WAREHOUSE: railstream
      CHECKPOINT_ROOT: /checkpoints
      SPARK_DRIVER_MEMORY: 1g
    ports:
      - 127.0.0.1:4040:4040     # Spark UI (jobs, streaming batches)
    volumes:
      - spark-checkpoints:/checkpoints
    depends_on:
      redpanda: {condition: service_healthy}
      lakekeeper: {condition: service_healthy}
    mem_limit: 1536m            # 1 GB driver heap + JVM overhead + Python
    restart: unless-stopped
    logging: *default-logging

  # Spark Connect server for Airflow's batch jobs (Iceberg maintenance, ADR-015): Airflow sends SQL
  # over gRPC with pyspark-client, so it needs no Java and no Docker socket. Network-internal only.
  spark-connect:
    build:
      context: ../..
      dockerfile: infra/spark/Dockerfile
    image: railstream-spark:dev
    profiles: ["airflow"]
    command: ["python", "-m", "streaming.connect_server"]
    environment:
      CATALOG_URI: http://lakekeeper:8181/catalog
      WAREHOUSE: railstream
      SPARK_DRIVER_MEMORY: 1g
    ports:
      - 127.0.0.1:4042:4040     # its Spark UI (maintenance jobs), via make tunnel
    depends_on:
      lakekeeper: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 15002), 2)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1536m
    restart: unless-stopped
    logging: *default-logging

  # Bronze -> typed/current movements, revision history and DLQ (Day 6).
  spark-silver:
    build:
      context: ../..
      dockerfile: infra/spark/Dockerfile
    image: railstream-spark:dev
    profiles: ["stream"]
    command: ["python", "-m", "streaming.silver"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      CATALOG_URI: http://lakekeeper:8181/catalog
      WAREHOUSE: railstream
      SPARK_DRIVER_MEMORY: 1536m   # 768m ran out of heap on a large catch-up batch (F23)
      SPARK_SHUFFLE_PARTITIONS: "2"
    ports:
      - 127.0.0.1:4041:4040
    volumes:
      - spark-checkpoints:/checkpoints
    depends_on:
      redpanda: {condition: service_healthy}
      lakekeeper: {condition: service_healthy}
    mem_limit: 3072m            # 1.5 GB heap + JVM overhead + Python UDF workers (cloud VM: 12 GB)
    restart: unless-stopped
    logging: *default-logging

volumes:
  airflow-home:
  spark-checkpoints:
  redpanda-data:
  seaweedfs-data:
  postgres-data:
