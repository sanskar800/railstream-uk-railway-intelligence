# RailStream gold layer: dbt on DuckDB reading silver from Iceberg and writing gold back to
# Iceberg through the Lakekeeper catalog (ADR-004, ADR-017). Definitions: docs/metrics.md.
name: railstream
version: "1.0.0"
profile: railstream
model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

models:
  railstream:
    staging:
      +materialized: ephemeral      # inlined into the gold queries; no stored copy of silver
    gold:
      +materialized: iceberg_table  # macros/iceberg_table.sql: atomic content swap in Iceberg
      +database: lake
      +schema: gold
      +rebuild_window_column: local_date  # rebuild only recent dates (ADR-018)

vars:
  # TRUST times are whole minutes, so delay wobbles +/-1 between reports; steps smaller than
  # this are rounding noise, not delay gained or recovered (docs/metrics.md §3, findings F33).
  delay_step_threshold_min: 3
  # A delay this large is a feed artefact, not lateness: timetable_variation stops at 999, or the
  # train was matched to another day's schedule ("999 minutes early"). Such reports stay in
  # silver but are left out of delay metrics (docs/metrics.md §2, findings F34).
  implausible_delay_min: 720

seeds:
  railstream:
    operators:
      +column_types:
        sector_code: varchar
        operator_name: varchar
        business_code: varchar
        atoc_code: varchar
        is_passenger: boolean
        service_group: varchar
    golden_2026_11_18:  # expected gold aggregates for one fixed day (tests/assert_golden_day.sql)
      +column_types:
        metric: varchar
        key: varchar
        value: bigint
